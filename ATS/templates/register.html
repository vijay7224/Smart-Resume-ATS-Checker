<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
    font-family:'Segoe UI',sans-serif;
}

.register-card{
    width:100%;
    border:none;
    border-radius:25px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.15);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    color:white;
}

.logo{
    width:80px;
    height:80px;
    background:white;
    color:#4f46e5;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:35px;
    margin-bottom:15px;
}

.form-control{
    height:50px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    color:white;
}

.form-control::placeholder{
    color:#e5e7eb;
}

.form-control:focus{
    background:rgba(255,255,255,0.25);
    box-shadow:none;
    color:white;
}

.input-group-text{
    border:none;
    background:rgba(255,255,255,0.2);
    color:white;
}

.btn-register{
    height:50px;
    border:none;
    border-radius:12px;
    background:white;
    color:#4f46e5;
    font-weight:600;
    transition:0.3s;
}

.btn-register:hover{
    transform:translateY(-2px);
    background:#f3f4f6;
}

.register-title{
    font-weight:700;
}

.register-subtitle{
    color:#e5e7eb;
    font-size:14px;
}

a{
    color:white;
    font-weight:600;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card register-card p-4">

                <div class="logo">
                    <i class="fas fa-user-plus"></i>
                </div>

                <h2 class="text-center register-title">
                    Create Account
                </h2>

                <p class="text-center register-subtitle mb-4">
                    Register to get started
                </p>

                <form method="POST">

                    <div class="mb-3">
                        <label class="mb-2">Full Name</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter Full Name"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Email Address</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter Email"
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Password</label>

                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Create Password"
                                   required>
                        </div>
                    </div>

                    <button type="submit"
                            class="btn btn-register w-100">
                        Create Account
                    </button>

                </form>

                <div class="text-center mt-4">
                    Already have an account?
                    <a href="/login">
                        Login Here
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
